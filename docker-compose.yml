services:
  mongodb:
    image: mongo:7
    container_name: nestjs-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis Stack includes RedisTimeSeries (TS.*)
  redis:
    image: redis/redis-stack-server:latest
    container_name: nestjs-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  service-a:
    build:
      context: .
      dockerfile: apps/service-a/Dockerfile
    container_name: nestjs-service-a
    env_file:
      - .env
    environment:
      SERVICE_A_PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: nestjs_test_task
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_MESSAGING_HOST: redis
      REDIS_MESSAGING_PORT: 6379
    ports:
      - '3001:3001'
    volumes:
      - service_a_data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  service-b:
    build:
      context: .
      dockerfile: apps/service-b/Dockerfile
    container_name: nestjs-service-b
    env_file:
      - .env
    environment:
      SERVICE_B_PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: nestjs_test_task
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_MESSAGING_HOST: redis
      REDIS_MESSAGING_PORT: 6379
    ports:
      - '3002:3002'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-a:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  service_a_data:
